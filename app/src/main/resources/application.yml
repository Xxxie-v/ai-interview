# AI Interview Platform Configuration
# 智能AI面试官平台配置

logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: 8080
  # 明确指定HTTP响应编码
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# SpringDoc OpenAPI / Swagger配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  packages-to-scan: interview.guide.modules

spring:
  config:
    import: optional:classpath:voice-interview-opening.yml
  application:
    name: ai-interview-platform

  # 启用虚拟线程 (Java 21+)
  # 显著提升 I/O 密集型场景的并发能力，特别适合 AI 调用和 SSE 长连接
  threads:
    virtual:
      enabled: true

  # PostgreSQL数据库配置
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:interview_guide}
    username: ${POSTGRES_USER:postgres}
    # 与根目录 docker-compose.yml 中 postgres 服务默认一致（本地只起依赖容器 + bootRun 时无需改）
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${APP_DB_POOL_MAX_SIZE:10}
      minimum-idle: ${APP_DB_POOL_MIN_IDLE:2}
      connection-timeout: ${APP_DB_CONNECTION_TIMEOUT_MS:5000}
      validation-timeout: ${APP_DB_VALIDATION_TIMEOUT_MS:3000}
      leak-detection-threshold: ${APP_DB_LEAK_DETECTION_MS:20000}

  jpa:
    # 面试回答会等待外部大模型，禁止 Web 请求在等待期间持有 EntityManager/数据库连接。
    open-in-view: false
    hibernate:
      ddl-auto: update #首次启动用 create，表创建成功后，改回 update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB  # 支持知识库上传（简历限制在业务层检查）
      max-request-size: 50MB
  

  # Redisson配置 (使用 spring.redis.redisson，参考官方文档)
  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${REDIS_HOST:localhost}:${REDIS_PORT:6379}"
          database: 0
          connectionMinimumIdleSize: 10
          connectionPoolSize: 64
          subscriptionConnectionMinimumIdleSize: 1
          subscriptionConnectionPoolSize: 50
  
  # Spring AI 配置（chat + embedding 统一由 app.ai.providers 驱动，不使用自动配置）
  ai:
    # 禁用自动重试机制，让异常立即返回
    retry:
      max-attempts: 1  # 不重试，失败立即返回
      on-client-errors: false
    # PostgreSQL Vector Store配置
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024  # text-embedding-v3实际生成的向量维度
        initialize-schema: true # 开发环境设置为 true，方便快速启动。生产环境设置为 false，手动管理数据库 schema，避免意外变更。
        remove-existing-vector-store-table: false  # 保留现有表和数据

# Application custom configuration
app:
  ai:
    default-provider: ${APP_AI_DEFAULT_PROVIDER:dashscope}
    default-embedding-provider: ${APP_AI_DEFAULT_EMBEDDING_PROVIDER:dashscope}
    managed-providers:
      - dashscope-question
    embedding-dimensions: ${APP_AI_EMBEDDING_DIMENSIONS:1024}
    security:
      api-key-encryption-key: ${APP_AI_CONFIG_ENCRYPTION_KEY:}
      require-encryption-key: ${APP_AI_CONFIG_REQUIRE_ENCRYPTION_KEY:false}
    # 运行时可写的 Provider 配置落点（与 classpath 主 application.yml 隔离）。
    # 开发环境默认写到用户主目录下，避免污染源码目录或 jar 内 classpath 资源。
    config-yaml-path: ${APP_AI_CONFIG_YAML_PATH:${user.home}/.interview-guide/llm-providers.yml}
    config-env-path: ${APP_AI_CONFIG_ENV_PATH:${user.home}/.interview-guide/llm-providers.env}
    agent-utils:
      skills-root: ${APP_AI_AGENT_UTILS_SKILLS_ROOT:classpath:skills}
    providers:
      dashscope:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY:}
        model: ${AI_MODEL:qwen3.5-flash}
        embedding-model: text-embedding-v3
        embedding-dimensions: 1024
        supports-embedding: true
      # 异步出题使用更高质量的模型，避免影响实时追问的响应速度。
      dashscope-question:
        base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
        api-key: ${AI_BAILIAN_API_KEY:}
        model: ${AI_QUESTION_MODEL:qwen3.7-plus}
        supports-embedding: false
      lmstudio:
        base-url: http://localhost:1234
        api-key: ${PROVIDER_LMSTUDIO_API_KEY:lm-studio}
        model: qwen2.5-7b-instruct
        supports-embedding: false
      # ===== 预设 Provider（填完 API Key 后即可使用）=====
      # Moonshot AI / Kimi（OpenAI 兼容） https://platform.moonshot.cn/
      kimi:
        base-url: https://api.moonshot.cn/v1
        api-key: ${PROVIDER_KIMI_API_KEY:}
        model: ${PROVIDER_KIMI_MODEL:kimi-latest}
        temperature: 1
        supports-embedding: false
      # DeepSeek（OpenAI 兼容） https://api-docs.deepseek.com/
      deepseek:
        base-url: https://api.deepseek.com
        api-key: ${PROVIDER_DEEPSEEK_API_KEY:}
        model: ${PROVIDER_DEEPSEEK_MODEL:deepseek-v4-flash}
        supports-embedding: false
      # 智谱 AI / GLM（OpenAI 兼容） https://open.bigmodel.cn/
      glm:
        base-url: https://open.bigmodel.cn/api/coding/paas/v4
        api-key: ${PROVIDER_GLM_API_KEY:}
        model: ${PROVIDER_GLM_MODEL:glm-5}
        embedding-model: embedding-3
        embedding-dimensions: 1024
        supports-embedding: true
    router:
      enabled: ${APP_AI_ROUTER_ENABLED:true}
      latency-ewma-alpha: ${APP_AI_ROUTER_EWMA_ALPHA:0.2}
      error-window-size: ${APP_AI_ROUTER_ERROR_WINDOW_SIZE:50}
      minimum-error-samples: ${APP_AI_ROUTER_MIN_ERROR_SAMPLES:20}
      open-error-rate: ${APP_AI_ROUTER_OPEN_ERROR_RATE:0.3}
      open-consecutive-failures: ${APP_AI_ROUTER_OPEN_CONSECUTIVE_FAILURES:5}
      open-cooldown: ${APP_AI_ROUTER_OPEN_COOLDOWN:PT30S}
      half-open-max-calls: ${APP_AI_ROUTER_HALF_OPEN_MAX_CALLS:2}
      half-open-success-threshold: ${APP_AI_ROUTER_HALF_OPEN_SUCCESS_THRESHOLD:2}
      providers:
        dashscope:
          enabled: true
          supported-tasks: [FOLLOW_UP, QUESTION_GENERATE, REPORT]
          max-concurrency: 50
          level: FAST
          cost-weight: 1.0
        dashscope-question:
          enabled: true
          supported-tasks: [FOLLOW_UP, QUESTION_GENERATE, REPORT]
          max-concurrency: 30
          level: STRONG
          cost-weight: 1.4
        kimi:
          enabled: false
          supported-tasks: [QUESTION_GENERATE, REPORT]
          max-concurrency: 20
          level: STRONG
          cost-weight: 1.2
        deepseek:
          enabled: false
          supported-tasks: [QUESTION_GENERATE, REPORT]
          max-concurrency: 20
          level: STRONG
          cost-weight: 0.8
        glm:
          enabled: false
          supported-tasks: [QUESTION_GENERATE, REPORT]
          max-concurrency: 20
          level: STRONG
          cost-weight: 1.0
        lmstudio:
          enabled: false
          supported-tasks: [FOLLOW_UP, QUESTION_GENERATE]
          max-concurrency: 4
          level: FAST
          cost-weight: 0.1
      tasks:
        FOLLOW_UP:
          preferred-level: FAST
          total-budget: ${APP_AI_ROUTER_FOLLOW_UP_BUDGET:PT2S}
          target-latency: PT1.5S
          minimum-retry-budget: PT0.4S
          max-provider-attempts: 2
          max-concurrency: 60
          latency-weight: 0.5
          capacity-weight: 0.3
          health-weight: 0.2
          cost-weight: 0.0
        QUESTION_GENERATE:
          preferred-level: STRONG
          total-budget: ${APP_AI_ROUTER_QUESTION_BUDGET:PT90S}
          target-latency: PT8S
          minimum-retry-budget: PT5S
          max-provider-attempts: 2
          max-concurrency: 20
          latency-weight: 0.2
          capacity-weight: 0.2
          health-weight: 0.4
          cost-weight: 0.2
        REPORT:
          preferred-level: STRONG
          total-budget: ${APP_AI_ROUTER_REPORT_BUDGET:PT2M}
          target-latency: PT15S
          minimum-retry-budget: PT10S
          max-provider-attempts: 2
          max-concurrency: 20
          latency-weight: 0.1
          capacity-weight: 0.2
          health-weight: 0.4
          cost-weight: 0.3
    advisors:
      enabled: ${APP_AI_ADVISORS_ENABLED:true}
      tool-call-enabled: ${APP_AI_ADVISORS_TOOL_CALL_ENABLED:true}
      tool-call-conversation-history-enabled: ${APP_AI_ADVISORS_TOOL_CALL_CONVERSATION_HISTORY_ENABLED:false}
      stream-tool-call-responses: ${APP_AI_ADVISORS_STREAM_TOOL_CALL_RESPONSES:false}
      message-chat-memory-enabled: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_ENABLED:false}
      message-chat-memory-max-messages: ${APP_AI_ADVISORS_MESSAGE_CHAT_MEMORY_MAX_MESSAGES:120}
      simple-logger-enabled: ${APP_AI_ADVISORS_SIMPLE_LOGGER_ENABLED:false}
    # 结构化输出重试次数（用于 BeanOutputConverter 解析失败时的业务层重试）
    structured-max-attempts: ${APP_AI_STRUCTURED_MAX_ATTEMPTS:2}
    # 重试时是否将上次错误原因注入提示词，帮助模型定向修复输出
    structured-include-last-error: ${APP_AI_STRUCTURED_INCLUDE_LAST_ERROR:true}
    # 是否启用“修复型重试提示词”（关闭后每次重试沿用原始 system prompt）
    structured-retry-use-repair-prompt: ${APP_AI_STRUCTURED_RETRY_USE_REPAIR_PROMPT:true}
    # 修复型重试提示词中是否追加严格 JSON 指令
    structured-retry-append-strict-json-instruction: ${APP_AI_STRUCTURED_RETRY_APPEND_STRICT_JSON_INSTRUCTION:true}
    # 注入到重试提示词中的错误信息最大长度
    structured-error-message-max-length: ${APP_AI_STRUCTURED_ERROR_MESSAGE_MAX_LENGTH:200}
    # 是否开启结构化输出调用指标（invocations/attempts/latency）
    structured-metrics-enabled: ${APP_AI_STRUCTURED_METRICS_ENABLED:true}
    rag:
      rewrite:
        enabled: ${APP_AI_RAG_REWRITE_ENABLED:true}
      search:
        short-query-length: ${APP_AI_RAG_SHORT_QUERY_LENGTH:4}
        topk-short: ${APP_AI_RAG_TOPK_SHORT:20}
        topk-medium: ${APP_AI_RAG_TOPK_MEDIUM:12}
        topk-long: ${APP_AI_RAG_TOPK_LONG:8}
        min-score-short: ${APP_AI_RAG_MIN_SCORE_SHORT:0.18}
        min-score-default: ${APP_AI_RAG_MIN_SCORE_DEFAULT:0.28}
  auth:
    admin:
      username: ${APP_AUTH_ADMIN_USERNAME:admin}
      password: ${APP_AUTH_ADMIN_PASSWORD:change-me-before-production}
    jwt:
      secret: ${APP_AUTH_JWT_SECRET:interview-guide-local-dev-secret-change-me-please-32chars}
      issuer: ${APP_AUTH_JWT_ISSUER:interview-guide}
      access-token-ttl: ${APP_AUTH_ACCESS_TOKEN_TTL:PT30M}
      refresh-token-ttl: ${APP_AUTH_REFRESH_TOKEN_TTL:P14D}
      identity-encryption-key: ${APP_AUTH_IDENTITY_ENCRYPTION_KEY:}
    oauth2:
      state-expiration: ${APP_AUTH_OAUTH2_STATE_EXPIRATION:PT10M}
      wechat:
        client-id: ${APP_AUTH_WECHAT_CLIENT_ID:}
        client-secret: ${APP_AUTH_WECHAT_CLIENT_SECRET:}
        redirect-uri: ${APP_AUTH_WECHAT_REDIRECT_URI:}
      qq:
        client-id: ${APP_AUTH_QQ_CLIENT_ID:}
        client-secret: ${APP_AUTH_QQ_CLIENT_SECRET:}
        redirect-uri: ${APP_AUTH_QQ_REDIRECT_URI:}
  sms:
    provider: ${APP_SMS_PROVIDER:noop}
    region-id: ${APP_SMS_REGION_ID:cn-hangzhou}
    access-key-id: ${APP_SMS_ACCESS_KEY_ID:}
    access-key-secret: ${APP_SMS_ACCESS_KEY_SECRET:}
    sign-name: ${APP_SMS_SIGN_NAME:}
    template-code: ${APP_SMS_TEMPLATE_CODE:}
    scheme-name: ${APP_SMS_SCHEME_NAME:default}
    country-code: ${APP_SMS_COUNTRY_CODE:86}
    code-length: ${APP_SMS_CODE_LENGTH:6}
    valid-time: ${APP_SMS_VALID_TIME:300}
    interval: ${APP_SMS_INTERVAL:60}
    code-type: ${APP_SMS_CODE_TYPE:1}
    duplicate-policy: ${APP_SMS_DUPLICATE_POLICY:1}
    noop-code: ${APP_SMS_NOOP_CODE:123456}
    code-expiration: ${APP_SMS_CODE_EXPIRATION:PT5M}
    resend-interval: ${APP_SMS_RESEND_INTERVAL:PT60S}
    ip-window: ${APP_SMS_IP_WINDOW:PT1H}
    max-sends-per-ip: ${APP_SMS_MAX_SENDS_PER_IP:20}
    max-attempts: ${APP_SMS_MAX_ATTEMPTS:5}
    expose-code: ${APP_SMS_EXPOSE_CODE:false}
  interview:
    follow-up-count: ${APP_INTERVIEW_FOLLOW_UP_COUNT:1}
    dynamic-follow-up-provider: ${APP_INTERVIEW_DYNAMIC_FOLLOW_UP_PROVIDER:dashscope}
    question-generation-provider: ${APP_INTERVIEW_QUESTION_GENERATION_PROVIDER:dashscope-question}
    dynamic-evaluation-timeout: ${APP_INTERVIEW_DYNAMIC_EVALUATION_TIMEOUT:PT6S}
    dynamic-max-total-questions: ${APP_INTERVIEW_DYNAMIC_MAX_TOTAL_QUESTIONS:48}
    dynamic-max-follow-ups-per-topic: ${APP_INTERVIEW_DYNAMIC_MAX_FOLLOW_UPS_PER_TOPIC:2}
    dynamic-max-topic-duration: ${APP_INTERVIEW_DYNAMIC_MAX_TOPIC_DURATION:PT4M}
    dynamic-coverage-threshold: ${APP_INTERVIEW_DYNAMIC_COVERAGE_THRESHOLD:0.75}
    dynamic-max-stagnant-rounds: ${APP_INTERVIEW_DYNAMIC_MAX_STAGNANT_ROUNDS:2}
    dynamic-recent-qa-limit: ${APP_INTERVIEW_DYNAMIC_RECENT_QA_LIMIT:2}
    official-min-questions-per-source: ${APP_INTERVIEW_OFFICIAL_MIN_QUESTIONS_PER_SOURCE:3}
    official-max-questions-per-source: ${APP_INTERVIEW_OFFICIAL_MAX_QUESTIONS_PER_SOURCE:6}
    job-fixed-question-count: ${APP_INTERVIEW_JOB_FIXED_QUESTION_COUNT:6}
    resume-prepared-question-count: ${APP_INTERVIEW_RESUME_PREPARED_QUESTION_COUNT:6}
    events:
      retention: ${APP_INTERVIEW_EVENT_RETENTION:PT2H}
      max-events-per-session: ${APP_INTERVIEW_EVENT_MAX_PER_SESSION:200}
    video:
      chunk-duration: ${APP_INTERVIEW_VIDEO_CHUNK_DURATION:PT25S}
      max-chunk-size: ${APP_INTERVIEW_VIDEO_MAX_CHUNK_SIZE:26214400}
      retention-days: ${APP_INTERVIEW_VIDEO_RETENTION_DAYS:30}
      cleanup-cron: ${APP_INTERVIEW_VIDEO_CLEANUP_CRON:0 30 3 * * *}
      allowed-mime-types:
        - video/webm
        - video/webm;codecs=vp8,opus
        - video/webm;codecs=vp9,opus
        - video/mp4
    vision:
      enabled: ${APP_INTERVIEW_VISION_ENABLED:true}
      provider: ${APP_INTERVIEW_VISION_PROVIDER:mock}
      frame-interval: ${APP_INTERVIEW_VISION_FRAME_INTERVAL:PT5S}
      suspect-frame-interval: ${APP_INTERVIEW_VISION_SUSPECT_FRAME_INTERVAL:PT1S}
      confirmation-frames: ${APP_INTERVIEW_VISION_CONFIRMATION_FRAMES:3}
      face-missing-min-duration: ${APP_INTERVIEW_VISION_FACE_MISSING_MIN_DURATION:PT2S}
      multiple-faces-min-duration: ${APP_INTERVIEW_VISION_MULTIPLE_FACES_MIN_DURATION:PT1S}
      other-event-min-duration: ${APP_INTERVIEW_VISION_OTHER_EVENT_MIN_DURATION:PT1S}
      recovery-window: ${APP_INTERVIEW_VISION_RECOVERY_WINDOW:PT2S}
      state-ttl: ${APP_INTERVIEW_VISION_STATE_TTL:PT4H}
      max-frame-size: ${APP_INTERVIEW_VISION_MAX_FRAME_SIZE:1048576}
      event-cooldown: ${APP_INTERVIEW_VISION_EVENT_COOLDOWN:PT30S}
      low-light-threshold: ${APP_INTERVIEW_VISION_LOW_LIGHT_THRESHOLD:40}
      mock:
        face-count: ${APP_INTERVIEW_VISION_MOCK_FACE_COUNT:1}
        confidence: ${APP_INTERVIEW_VISION_MOCK_CONFIDENCE:0.5}
      onnx:
        detector-model: ${APP_INTERVIEW_VISION_SCRFD_MODEL:models/vision/det_10g.onnx}
        recognition-model: ${APP_INTERVIEW_VISION_ARCFACE_MODEL:models/vision/w600k_r50.onnx}
        detector-input-size: ${APP_INTERVIEW_VISION_DETECTOR_INPUT_SIZE:640}
        recognition-input-size: ${APP_INTERVIEW_VISION_RECOGNITION_INPUT_SIZE:112}
        detection-threshold: ${APP_INTERVIEW_VISION_DETECTION_THRESHOLD:0.5}
        nms-threshold: ${APP_INTERVIEW_VISION_NMS_THRESHOLD:0.4}
        identity-threshold: ${APP_INTERVIEW_VISION_IDENTITY_THRESHOLD:0.5}
        reference-min-confidence: ${APP_INTERVIEW_VISION_REFERENCE_MIN_CONFIDENCE:0.75}
        reference-ttl: ${APP_INTERVIEW_VISION_REFERENCE_TTL:PT4H}
    violation:
      screen-switch-threshold: ${APP_INTERVIEW_VIOLATION_SCREEN_SWITCH_THRESHOLD:3}
      screen-switch-merge-window: ${APP_INTERVIEW_VIOLATION_SCREEN_SWITCH_MERGE_WINDOW:PT2S}
      min-anomaly-count: ${APP_INTERVIEW_VIOLATION_MIN_ANOMALY_COUNT:3}
      max-anomaly-count: ${APP_INTERVIEW_VIOLATION_MAX_ANOMALY_COUNT:5}
      anomaly-duration-threshold: ${APP_INTERVIEW_VIOLATION_DURATION_THRESHOLD:PT30S}
      count-weight: ${APP_INTERVIEW_VIOLATION_COUNT_WEIGHT:0.6}
      duration-weight: ${APP_INTERVIEW_VIOLATION_DURATION_WEIGHT:0.4}
      risk-threshold: ${APP_INTERVIEW_VIOLATION_RISK_THRESHOLD:0.6}
      severe-event-weight: ${APP_INTERVIEW_VIOLATION_SEVERE_EVENT_WEIGHT:1.0}
      face-missing-weight: ${APP_INTERVIEW_VIOLATION_FACE_MISSING_WEIGHT:0.75}
      low-light-weight: ${APP_INTERVIEW_VIOLATION_LOW_LIGHT_WEIGHT:0.25}
    evaluation:
      batch-size: ${APP_INTERVIEW_EVALUATION_BATCH_SIZE:8}
  resume:
    upload-dir: ${java.io.tmpdir}/ai-interview/resumes
    allowed-types:
      - application/pdf
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document
      - text/plain

  # RustFS (S3兼容) 存储配置
  storage:
    provider: ${APP_STORAGE_PROVIDER:local}
    local-dir: ${APP_STORAGE_LOCAL_DIR:${java.io.tmpdir}/interview-guide/storage}
    endpoint: ${APP_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${APP_STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${APP_STORAGE_SECRET_KEY:minioadmin}
    bucket: ${APP_STORAGE_BUCKET:interview-guide}
    region: ${APP_STORAGE_REGION:us-east-1}
    path-style-access: ${APP_STORAGE_PATH_STYLE_ACCESS:true}
  
  # CORS配置 - React前端
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:80}

  # Voice interview configuration
  voice-interview:
    speech:
      asr-provider: ${APP_VOICE_ASR_PROVIDER:qwen}
      tts-provider: ${APP_VOICE_TTS_PROVIDER:qwen}
      mock:
        transcript: ${APP_VOICE_MOCK_TRANSCRIPT:这是本地模拟语音识别结果，请结合当前问题继续面试。}
        sample-rate: ${APP_VOICE_MOCK_SAMPLE_RATE:16000}
        silence-duration-ms: ${APP_VOICE_MOCK_SILENCE_MS:800}
        energy-threshold: ${APP_VOICE_MOCK_ENERGY_THRESHOLD:500}
        tts-sample-rate: ${APP_VOICE_MOCK_TTS_SAMPLE_RATE:24000}
    # Phase duration settings (minutes)
    phase:
      intro:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_INTRO_MAX_QUESTIONS:5}
      tech:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MIN_QUESTIONS:3}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_TECH_MAX_QUESTIONS:8}
      project:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_DURATION:8}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_SUGGESTED_DURATION:10}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_DURATION:15}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_PROJECT_MAX_QUESTIONS:5}
      hr:
        min-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_DURATION:3}
        suggested-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_SUGGESTED_DURATION:5}
        max-duration: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_DURATION:8}
        min-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MIN_QUESTIONS:2}
        max-questions: ${APP_VOICE_INTERVIEW_PHASE_HR_MAX_QUESTIONS:5}

    # TTS configuration
    tts:
      default-voice: ${APP_VOICE_INTERVIEW_TTS_DEFAULT_VOICE:siyue}  # 思悦 - 温柔自然的女声

    # Qwen3 Realtime ASR Configuration
    qwen:
      asr:
        url: wss://dashscope.aliyuncs.com/api-ws/v1/realtime
        model: qwen3-asr-flash-realtime
        api-key: ${AI_BAILIAN_API_KEY:}
        language: zh
        format: pcm
        sample-rate: 16000
        enable-turn-detection: true
        turn-detection-type: server_vad
        turn-detection-threshold: 0.0
        # 静音多久判为一句结束；中文面试思考停顿常见 2-3s，设 2000 避免句中切段
        turn-detection-silence-duration-ms: ${APP_VOICE_ASR_SILENCE_MS:2000}

      # Qwen TTS Realtime Configuration (WebSocket-based)
      # 音色列表文档：https://help.aliyun.com/zh/model-studio/qwen-tts-realtime
      tts:
        model: qwen3-tts-flash-realtime
        api-key: ${AI_BAILIAN_API_KEY:}
        voice: Cherry
        format: pcm
        sample-rate: 24000
        mode: commit
        language-type: Chinese
        speech-rate: 1.0
        volume: 60

    # 用户说完一小段 STT 定稿后，再等多久（毫秒）才触发面试官回复；需大于 VAD 静音阈值以确保用户继续说话时 partials 能取消
    user-utterance-debounce-ms: ${APP_VOICE_USER_UTTERANCE_DEBOUNCE_MS:2500}
    # 触发提交前要求的最小静音时长（毫秒），从最后一次 STT 活动（含 partial）算起
    min-silence-before-commit-ms: ${APP_VOICE_MIN_SILENCE_BEFORE_COMMIT_MS:2500}
    # 当内容较短时先不提交，等待继续说（字符数）
    min-commit-chars: ${APP_VOICE_MIN_COMMIT_CHARS:20}
    # 最长等待用户继续补充的时间（毫秒），超时后强制提交
    max-wait-for-continuation-ms: ${APP_VOICE_MAX_WAIT_FOR_CONTINUATION_MS:7000}
    # 语音面试单轮面试官回复最大长度（字符）
    ai-question-max-chars: ${APP_VOICE_AI_QUESTION_MAX_CHARS:120}

    # Rate limiting
    rate-limit:
      max-per-session: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_SESSION:10}  # messages per second
      max-per-ip: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_PER_IP:3}  # interviews per hour
      max-concurrent: ${APP_VOICE_INTERVIEW_RATE_LIMIT_MAX_CONCURRENT:50}  # global concurrent interviews

    # Audio specifications
    audio:
      codec: ${APP_VOICE_INTERVIEW_AUDIO_CODEC:opus}
      sample-rate: ${APP_VOICE_INTERVIEW_AUDIO_SAMPLE_RATE:16000}
      bit-rate: ${APP_VOICE_INTERVIEW_AUDIO_BIT_RATE:24000}
      channels: ${APP_VOICE_INTERVIEW_AUDIO_CHANNELS:1}
      chunk-duration: ${APP_VOICE_INTERVIEW_AUDIO_CHUNK_DURATION:2000}  # 2 seconds
